name: Box agent
version: "0.1.0"
image: ghcr.io/mihajlo-stojkovic/ha-provision-box-agent
slug: fleet_box_agent
description: Connects this box to the fleet platform and keeps an outbound command socket.
url: https://github.com/mihajlo-stojkovic/ha-provision-apps
arch:
  - aarch64
  - amd64
startup: services
boot: auto
hassio_api: true
homeassistant_api: true
hassio_role: manager
map:
  - type: backup
    read_only: true
    path: /backup
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
  - type: ssl
    read_only: false
    path: /ssl
backup_exclude:
  - "*"
options:
  box_id: ""
  platform_url: ""
  enrollment_code: ""
  time_zone: ""
  backup_agents: []
  backup_password: ""
  backup_include_all_addons: false
  backup_include_folders: []
  sftp_host: ""
  sftp_port: 23
  sftp_username: ""
  sftp_remote_dir: ""
  acme_directory_url: "https://acme-v02.api.letsencrypt.org/directory"
  acme_terms_of_service_agreed: false
  z2m_base_topic: zigbee2mqtt
schema:
  box_id: str
  platform_url: str
  enrollment_code: str?
  time_zone: str?
  backup_agents:
    - str
  backup_password: str?
  backup_include_all_addons: bool?
  backup_include_folders:
    - str
  sftp_host: str?
  sftp_port: port?
  sftp_username: str?
  sftp_remote_dir: str?
  acme_directory_url: url?
  acme_email: email?
  acme_terms_of_service_agreed: bool?
  z2m_base_topic: str?
  extra_ca_certificate: str?
