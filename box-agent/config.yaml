name: Box agent
version: "0.5.0"
image: ghcr.io/mihajlo-stojkovic/ha-provision-box-agent
slug: fleet_box_agent
description: Connects this box to the fleet platform and keeps an outbound command socket.
url: https://github.com/mihajlo-stojkovic/ha-provision-apps
arch:
  - aarch64
  - amd64
startup: services
boot: auto
hassio_api: true
homeassistant_api: true
hassio_role: manager
map:
  - type: backup
    read_only: true
    path: /backup
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
  - type: ssl
    read_only: false
    path: /ssl
backup_exclude:
  - "*"
options:
  box_id: ""
  platform_url: ""
  enrollment_code: ""
  time_zone: ""
  backup_agents: []
  backup_password: ""
  backup_include_all_addons: false
  backup_include_folders: []
  z2m_base_topic: zigbee2mqtt
schema:
  box_id: str
  platform_url: str
  enrollment_code: str?
  time_zone: str?
  backup_agents:
    - str
  backup_password: str?
  backup_include_all_addons: bool?
  backup_include_folders:
    - str
  z2m_base_topic: str?
  extra_ca_certificate: str?
